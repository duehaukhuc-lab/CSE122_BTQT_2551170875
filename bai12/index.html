<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12 — Lịch và Lời chào</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">

    <div class="card calendar-card shadow-sm p-4 border-0">
        <div class="calendar-box border rounded p-3 text-center mb-3">
            <div id="year" class="year">2026</div>
            <div id="month" class="month">Tháng 12</div>
            <div id="day-number" class="day-number">24</div>
            <div id="day-name" class="day-name">Thứ hai</div>
        </div>

        <div id="greeting" class="greeting text-center my-3 fw-medium">Chào buổi sáng!</div>

        <form class="calendar-form rounded p-2 d-flex align-items-center gap-2" onsubmit="return false;">
            <div class="input-field text-center flex-fill">
                <label for="input-day" class="form-label small mb-1">Ngày</label>
                <input type="number" id="input-day" class="form-control text-center py-1 px-1" value="24">
            </div>
            <div class="input-field text-center flex-fill">
                <label for="input-month" class="form-label small mb-1">Tháng</label>
                <input type="number" id="input-month" class="form-control text-center py-1 px-1" value="12">
            </div>
            <div class="input-field text-center flex-fill">
                <label for="input-year" class="form-label small mb-1">Năm</label>
                <input type="number" id="input-year" class="form-control text-center py-1 px-1" value="2026">
            </div>
            <button type="button" id="btn-print" class="btn btn-secondary px-3 py-2 small">In<br>lịch</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
