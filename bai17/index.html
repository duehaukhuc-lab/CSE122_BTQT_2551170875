<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 17 — Đăng ký tài khoản</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Đăng ký tài khoản</h2>
        <p>Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>

        <form id="register-form" onsubmit="return validateForm()">
            <div class="form-group" id="group-fullname">
                <label>Họ và tên</label>
                <input type="text" id="fullname">
                <div class="msg"></div>
            </div>

            <div class="form-group" id="group-email">
                <label>Email</label>
                <input type="text" id="email">
                <div class="msg"></div>
            </div>

            <div class="form-group" id="group-password">
                <label>Mật khẩu</label>
                <input type="password" id="password">
                <div class="msg"></div>
            </div>

            <div class="form-group" id="group-confirm">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirm-password">
                <div class="msg"></div>
            </div>

            <button type="submit" class="btn-submit">Đăng ký</button>
        </form>
    </div>

    <script src="script.js"></script>

</body>
</html>
